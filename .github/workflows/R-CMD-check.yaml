on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # The first two lines are the workflow's own default, repeated because
      # setting this input replaces it rather than adding to it.
      #
      # The third exists for ubuntu-clang. libstdc++ 12 implements
      # std::stable_sort and std::stable_partition -- which CaDiCaL calls in
      # about ten places -- over its own std::get_temporary_buffer, which
      # C++17 deprecated, and unlike later versions it does not silence the
      # resulting diagnostic inside its own header. clang therefore reports a
      # deprecation from within libstdc++ and R CMD check escalates it to
      # "Found the following significant warnings". The defect is the image's:
      # clang23 builds against libc++ and gcc16 ships a newer libstdc++, and
      # both are clean, as is CRAN's debian-clang.
      #
      # libstdc++ guards the attribute on __DEPRECATED, which the compiler
      # predefines in C++ mode, so undefining it empties the macro. Be clear
      # about what this is: suppression by another route. It silences every
      # libstdc++ deprecation for C++ in the container job, not just this one.
      # It is here rather than in src/Makevars because the package cannot do
      # it at all -- PKG_CXXFLAGS = -Wno-deprecated-declarations fails
      # "checking compilation flags used", which rejects flags that suppress
      # warnings, and so does the same flag set from here. -U__DEPRECATED
      # passes that check where -Wno-* does not.
      #
      # It must be CXX17FLAGS, not CXXFLAGS: src/Makevars sets CXX_STD = CXX17,
      # and R then compiles through the per-standard variable, so appending to
      # CXXFLAGS is silently ignored.
      #
      # Drop this and set containers to '["clang23", "ubuntu-gcc16"]' if you
      # would rather lose the leg than carry the suppression.
      # CRAN runs a flavour with suggested packages unavailable, and this
      # package has only testthat in Suggests -- so tests/testthat.R is the
      # whole exposure. The job is off by default, which is exactly why an
      # unguarded library(testthat) can sit in a repository with every check
      # green. Turned on so the guard is verified rather than assumed.
      nosuggests: true

      container-makevars: |
        CC += -std=gnu23
        CFLAGS += -pedantic
        CXX17FLAGS += -U__DEPRECATED
