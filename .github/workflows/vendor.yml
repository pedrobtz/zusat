on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "51 19 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/cadical
      verify: tools/vendor/verify
      must-update: |
        tools/vendor/manifest.tsv
        tools/vendor/checksums.sha256
